<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #666666;
    --line: #e2e2e2;
    --accent: #1f4e78;
    --code-bg: #f5f5f5;
    --warn-bg: #fff3cd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6e6e6;
      --bg: #1e1e1e;
      --muted: #9aa0a6;
      --line: #3a3a3a;
      --accent: #7aa6d6;
      --code-bg: #2a2a2a;
      --warn-bg: #3a3320;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    color: var(--fg);
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.6rem; border-bottom: 3px solid var(--accent); padding-bottom: .4rem; }
  h2 { font-size: 1.25rem; margin-top: 2rem; border-left: 5px solid var(--accent); padding-left: .5rem; }
  h3 { font-size: 1.05rem; margin-top: 1.4rem; }
  .meta { margin: 1rem 0 1.5rem; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .meta table { width: 100%; border-collapse: collapse; }
  .meta td { padding: .4rem .7rem; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .meta td:first-child { width: 9rem; font-weight: bold; color: var(--muted); background: var(--code-bg); }
  .sensitivity { display: inline-block; padding: .15rem .6rem; border-radius: 4px; font-size: .8rem; background: var(--warn-bg); border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .92rem; }
  th, td { border: 1px solid var(--line); padding: .45rem .6rem; text-align: left; vertical-align: top; }
  th { background: var(--accent); color: #fff; }
  .scroll { overflow-x: auto; }
  code { background: var(--code-bg); padding: .1rem .3rem; border-radius: 3px; font-size: .88em; }
  pre { background: var(--code-bg); padding: .8rem; border-radius: 6px; overflow-x: auto; font-size: .85rem; }
  blockquote { border-left: 4px solid var(--accent); margin: 1rem 0; padding: .3rem .9rem; color: var(--muted); }
  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
  @media print { body { padding: 0; } h2 { break-after: avoid; } table, pre { break-inside: avoid; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>{{TITLE}}</h1>
    <div class="meta"><table>{{META_ROWS}}</table></div>
    <p class="sensitivity">{{SENSITIVITY}}</p>
    {{BODY_HTML}}
    <footer>生成: {{GENERATED_AT}} / 本レポートは一次報告であり、推奨・外部操作は実施前に確認が必要です。機微情報のマスク状況を共有前に確認してください。</footer>
  </div>
</body>
</html>
